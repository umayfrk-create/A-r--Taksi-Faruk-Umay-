<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ağrı Taksi Faruk Umay</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f4f4f4;
      color:#222;
      text-align:center;
    }
    .hero{
      background:#111;
      color:white;
      padding:55px 20px;
    }

      margin:0 0 12px;

    }
    .card{
      max-width:600px;
      margin:25px auto;
      background:white;
      padding:30px 20px;
      border-radius:16px;
      box-shadow:0 4px 15px rgba(0,0,0,.12);
    }
    .card h2{
      margin-top:0;
    }
    .info{
      line-height:1.8;
      font-size:17px;
    }
    .call{
      display:inline-block;
      margin-top:20px;
      padding:15px 28px;
      background:#f5c400;
      color:#111;
      text-decoration:none;
      font-weight:bold;
      border-radius:10px;
      font-size:19px;
    }
    footer{
      margin-top:30px;
      padding:20px;
      background:#111;
      color:#fff;
      font-size:14px;
    }
  </style>
</head>
<body>

  <section class="hero">

  <div class="card">

    </a>

    © 2026 Ağrı Taksi Faruk Umay
